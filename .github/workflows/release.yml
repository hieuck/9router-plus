name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: metadata
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $pattern = '^v(?<version>(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'

          if ($tag -notmatch $pattern) {
            throw "Release tag '$tag' is invalid. Use vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-IDENTIFIER."
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Public release preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_REPORTING_CHANNEL: ${{ secrets.SECURITY_REPORTING_CHANNEL }}
        run: .\scripts\release-preflight.ps1 -RequireLicense -RequirePublicRepository -RequirePrivateSecurityChannel

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: dotnet restore RouterPlus.sln --runtime win-x64

      - name: Test
        shell: pwsh
        run: >-
          dotnet test RouterPlus.sln
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=RouterPlus.Release.Tests.trx"
          --results-directory "$env:RUNNER_TEMP\release-test-results"

      - name: Build
        shell: pwsh
        run: dotnet build RouterPlus.sln --configuration Release --no-restore

      - name: Publish
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP 'routerplus-release-publish'
          if (Test-Path -LiteralPath $publishDirectory) {
            Remove-Item -LiteralPath $publishDirectory -Recurse -Force
          }

          dotnet publish src/RouterPlus.App/RouterPlus.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDirectory `
            -p:Version=$env:RELEASE_VERSION `
            -p:InformationalVersion=$env:RELEASE_TAG

          dotnet publish src/RouterPlus.Updater/RouterPlus.Updater.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output $publishDirectory `
            -p:Version=$env:RELEASE_VERSION `
            -p:InformationalVersion=$env:RELEASE_TAG

      - name: Add release documentation
        shell: pwsh
        run: .\scripts\package-release.ps1 -PublishDirectory "$env:RUNNER_TEMP\routerplus-release-publish"

      - name: Sign release binaries
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD)) {
            throw 'Windows signing certificate secrets are required. Release is blocked.'
          }

          $publishDirectory = Join-Path $env:RUNNER_TEMP 'routerplus-release-publish'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'routerplus-release-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE_BASE64))
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($signtool)) {
            throw 'signtool.exe is not available on the runner.'
          }

          foreach ($binary in @('RouterPlus.exe', 'RouterPlus.Updater.exe')) {
            $binaryPath = Join-Path $publishDirectory $binary
            & $signtool sign /fd SHA256 /f $certificatePath /p $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $binaryPath
            if ($LASTEXITCODE -ne 0) {
              throw "Could not sign $binary"
            }
          }

      - name: Verify signing gates
        shell: pwsh
        env:
          UPDATE_SIGNING_SUBJECT: ${{ secrets.UPDATE_SIGNING_SUBJECT }}
          MANIFEST_SIGNING_KEY_BASE64: ${{ secrets.MANIFEST_SIGNING_KEY_BASE64 }}
        run: .\scripts\release-preflight.ps1 -RequireUpdateSigning -PublishDirectory "$env:RUNNER_TEMP\routerplus-release-publish"

      - name: Package release
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          MANIFEST_SIGNING_KEY_BASE64: ${{ secrets.MANIFEST_SIGNING_KEY_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MANIFEST_SIGNING_KEY_BASE64)) {
            throw 'MANIFEST_SIGNING_KEY_BASE64 is required. Release is blocked.'
          }

          $publishDirectory = Join-Path $env:RUNNER_TEMP 'routerplus-release-publish'
          $archiveName = "RouterPlus-$env:RELEASE_TAG-win-x64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP $archiveName
          $checksumPath = "$archivePath.sha256"
          $manifestPath = Join-Path $env:RUNNER_TEMP "RouterPlus-$env:RELEASE_TAG-manifest.json"

          Compress-Archive `
            -Path (Join-Path $publishDirectory '*') `
            -DestinationPath $archivePath `
            -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          $manifest = [ordered]@{
            version = $env:RELEASE_VERSION
            channel = if ($env:RELEASE_VERSION.Contains('-')) { 'prerelease' } else { 'stable' }
            assetName = $archiveName
            sha256 = $hash
            publisher = '9Router Project'
            signature = ''
          }
          $manifest | ConvertTo-Json -Depth 5 -Compress | Set-Content -LiteralPath $manifestPath -Encoding utf8
          $manifestKeyPath = Join-Path $env:RUNNER_TEMP 'routerplus-manifest-signing.pem'
          [IO.File]::WriteAllBytes($manifestKeyPath, [Convert]::FromBase64String($env:MANIFEST_SIGNING_KEY_BASE64))
          .\scripts\sign-release-manifest.ps1 -ManifestPath $manifestPath -PrivateKeyPath $manifestKeyPath

          "archive=$archivePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "manifest=$manifestPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          ARCHIVE_PATH: ${{ steps.package.outputs.archive }}
          CHECKSUM_PATH: ${{ steps.package.outputs.checksum }}
          MANIFEST_PATH: ${{ steps.package.outputs.manifest }}
        run: |
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--repo', $env:GITHUB_REPOSITORY,
            '--title', "RouterPlus $env:RELEASE_TAG",
            '--generate-notes',
            '--verify-tag'
          )

          if ($env:RELEASE_VERSION.Contains('-')) {
            $arguments += '--prerelease'
          }

          $arguments += @($env:ARCHIVE_PATH, $env:CHECKSUM_PATH, $env:MANIFEST_PATH)
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
